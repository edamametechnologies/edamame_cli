name: Test CLI Installers

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      release_context:
        description: >-
          Set by release_all.sh Phase 2. Skips the package-manager jobs
          (Homebrew, Chocolatey) and gates on the GitHub release assets
          instead. A freshly pushed Chocolatey package sits in MODERATION and
          a Homebrew tap needs to propagate, so neither reflects the release
          being validated -- `choco install` keeps serving the PREVIOUS
          version, which makes the gate report on an artifact this release did
          not produce. That is how edamame-cli 1.8.1 stayed "latest" while two
          newer versions were published. Outside a release these jobs still
          run on the 6-hourly schedule, which is where the real user install
          path belongs.
        type: boolean
        default: false
      version:
        description: >-
          Release to test: "latest" (the default, and what the schedule
          tests), a version (2.3.2) or its tag (v2.3.2). With a version, the
          GitHub release jobs download that release's assets by tag and the
          package jobs install that version, without resolving
          releases/latest: a release can then be tested before it is the
          latest one, while it is still a prerelease.
        type: string
        default: latest

# Auto cancel previous runs if they were not completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_BASE: "https://github.com/edamametechnologies/edamame_cli"

jobs:
  linux-apt:
    name: Ubuntu (APT package)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Determine the version to test
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # A version given as input is the one to install: nothing is
          # resolved. (Empty on the schedule, which tests the latest release.)
          REQUESTED="${REQUESTED_VERSION:-latest}"
          REQUESTED="${REQUESTED#v}"
          if [[ "$REQUESTED" != "latest" ]]; then
            if ! [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must be latest, X.Y.Z or vX.Y.Z, got '${REQUESTED_VERSION}'"
              exit 1
            fi
            echo "Testing the requested version: ${REQUESTED}"
            echo "version=${REQUESTED}" >> "${GITHUB_OUTPUT}"
            echo "requested=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # The public releases/latest redirect needs no token, so the org IP
          # allow list does not apply on this hosted runner (the repo is
          # public) and there is no API rate limit. Only a redirect to a tag
          # gives a version; a redirect to /releases is GitHub's "no published
          # release". Anything else (403, 404, 5xx, no answer) is a failed
          # lookup. Every case but a version fails the job: the old fallback
          # to 1.2.0 compared the install against an ancient version.
          LATEST_URL="${REPO_BASE}/releases/latest"
          if ! RESP=$(curl -sS --retry 3 --retry-delay 5 -o /dev/null -w '%{http_code} %{redirect_url}' "$LATEST_URL"); then
            echo "::error::Latest release lookup failed: no answer from $LATEST_URL"
            exit 1
          fi
          CODE="${RESP%% *}"
          LOCATION="${RESP#* }"
          case "$CODE $LOCATION" in
            "302 "*/releases/tag/v*)
              VERSION="${LOCATION##*/releases/tag/v}"
              ;;
            "302 "*/releases)
              echo "::error::edamame_cli has no published release ($LATEST_URL redirects to the release list)"
              exit 1
              ;;
            *)
              echo "::error::Latest release lookup failed: HTTP $CODE ${LOCATION} from $LATEST_URL"
              exit 1
              ;;
          esac
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected latest release tag in $LOCATION"
            exit 1
          fi
          echo "Found latest version: ${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "requested=false" >> "${GITHUB_OUTPUT}"

      - name: Install prerequisites
        shell: bash
        run: |
          wait_for_apt_locks() {
            echo "Checking for apt/dpkg locks..."
            local TIMEOUT=300
            local TIME_PASSED=0
            local LOCK_FILES=(
              "/var/lib/apt/lists/lock"
              "/var/lib/dpkg/lock-frontend"
              "/var/lib/dpkg/lock"
              "/var/cache/apt/archives/lock"
            )
            while [ $TIME_PASSED -lt $TIMEOUT ]; do
              local LOCKED=false
              if command -v fuser >/dev/null 2>&1; then
                for lock_file in "${LOCK_FILES[@]}"; do
                  if [ -f "$lock_file" ] && sudo fuser "$lock_file" >/dev/null 2>&1; then
                    LOCKED=true
                    break
                  fi
                done
              fi
              if [ "$LOCKED" = "false" ]; then
                if ! sudo dpkg --configure -a 2>/dev/null; then
                  LOCKED=true
                fi
              fi
              if [ "$LOCKED" = "false" ]; then
                echo "No apt/dpkg locks held, proceeding..."
                return 0
              fi
              echo "Waiting for apt/dpkg locks... ($TIME_PASSED/${TIMEOUT}s)"
              sleep 5
              TIME_PASSED=$((TIME_PASSED + 5))
            done
            return 1
          }
          
          run_apt() {
            local MAX_ATTEMPTS=10
            local ATTEMPTS=0
            while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
              ATTEMPTS=$((ATTEMPTS + 1))
              echo "apt-get $* (attempt $ATTEMPTS/$MAX_ATTEMPTS)"
              if ! wait_for_apt_locks; then sleep 5; continue; fi
              if sudo -E apt-get "$@"; then return 0; fi
              sleep 5
            done
            return 1
          }

          # Make the helpers available to subsequent steps.
          cat <<'EOF' >/tmp/apt_helpers.sh
          wait_for_apt_locks() {
            echo "Checking for apt/dpkg locks..."
            local TIMEOUT=300
            local TIME_PASSED=0
            local LOCK_FILES=(
              "/var/lib/apt/lists/lock"
              "/var/lib/dpkg/lock-frontend"
              "/var/lib/dpkg/lock"
              "/var/cache/apt/archives/lock"
            )
            while [ $TIME_PASSED -lt $TIMEOUT ]; do
              local LOCKED=false
              if command -v fuser >/dev/null 2>&1; then
                for lock_file in "${LOCK_FILES[@]}"; do
                  if [ -f "$lock_file" ] && sudo fuser "$lock_file" >/dev/null 2>&1; then
                    LOCKED=true
                    break
                  fi
                done
              fi
              if [ "$LOCKED" = "false" ]; then
                if ! sudo dpkg --configure -a 2>/dev/null; then
                  LOCKED=true
                fi
              fi
              if [ "$LOCKED" = "false" ]; then
                echo "No apt/dpkg locks held, proceeding..."
                return 0
              fi
              echo "Waiting for apt/dpkg locks... ($TIME_PASSED/${TIMEOUT}s)"
              sleep 5
              TIME_PASSED=$((TIME_PASSED + 5))
            done
            return 1
          }

          run_apt() {
            local MAX_ATTEMPTS=10
            local ATTEMPTS=0
            while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
              ATTEMPTS=$((ATTEMPTS + 1))
              echo "apt-get $* (attempt $ATTEMPTS/$MAX_ATTEMPTS)"
              if ! wait_for_apt_locks; then sleep 5; continue; fi
              if sudo -E apt-get "$@"; then return 0; fi
              sleep 5
            done
            return 1
          }
          EOF
          source /tmp/apt_helpers.sh
          
          export DEBIAN_FRONTEND=noninteractive
          wait_for_apt_locks
          run_apt update -qq
          run_apt install -y curl gnupg ca-certificates

      - name: Install edamame-cli via APT
        id: install
        run: |
          set -euo pipefail
          source /tmp/apt_helpers.sh
          curl -sL https://edamame.s3.eu-west-1.amazonaws.com/repo/public.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/edamame.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/edamame.gpg] https://edamame.s3.eu-west-1.amazonaws.com/repo stable main" | \
            sudo tee /etc/apt/sources.list.d/edamame.list >/dev/null
          wait_for_apt_locks
          run_apt update -qq
          # A requested version is installed as such (the release workflow
          # names the package <version>-1); otherwise whatever the repository
          # serves.
          if [[ "${{ steps.version.outputs.requested }}" == "true" ]]; then
            run_apt install -y "edamame-cli=${{ steps.version.outputs.version }}-1"
          else
            run_apt install -y edamame-cli
          fi

      - name: Verify binary is available
        id: verify
        run: |
          set -euo pipefail
          command -v edamame_cli
          INSTALLED_VERSION=$(edamame_cli --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          EXPECTED_VERSION="${{ steps.version.outputs.version }}"
          echo "Installed: ${INSTALLED_VERSION:-unknown}, Expected: ${EXPECTED_VERSION}"
          if [[ -n "$INSTALLED_VERSION" && -n "$EXPECTED_VERSION" && "$INSTALLED_VERSION" != "$EXPECTED_VERSION" ]]; then
            # A requested version that is not the one installed fails the
            # job: the test would report on another release.
            if [[ "${{ steps.version.outputs.requested }}" == "true" ]]; then
              echo "::error::Version mismatch (installed=${INSTALLED_VERSION} requested=${EXPECTED_VERSION})"
              exit 1
            fi
            echo "WARNING: Version mismatch (installed=${INSTALLED_VERSION} expected=${EXPECTED_VERSION})"
          fi
          edamame_cli --help | head -n 20

      - name: Slack alerts
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success') }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C072J0U9TH7'
          slack-message: |
            *CLI Installer Test (Ubuntu APT)*:
            - Installation: ${{ steps.install.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            - Verification: ${{ steps.verify.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            More details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      - name: Fail job if tests failed
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success') }}
        run: |
          echo "Tests for Ubuntu (APT) did not succeed"
          exit 1

  linux-apk:
    name: Alpine (APK package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: alpine:3.19
    steps:
      - name: Prepare Alpine
        run: |
          set -euo pipefail
          apk add --no-cache curl ca-certificates bash
          update-ca-certificates

      - name: Add repository and install edamame-cli
        id: install
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          REPO_URL="https://edamame.s3.eu-west-1.amazonaws.com/repo/alpine/v3.15/main"
          wget -q -O /etc/apk/keys/edamame.rsa.pub "${REPO_URL}/${ARCH}/edamame.rsa.pub" || true
          echo "${REPO_URL}" >> /etc/apk/repositories
          apk update
          # A requested version is installed as such (the release workflow
          # names the package <version>-r1); otherwise whatever the
          # repository serves. This step runs under the container's sh.
          REQUESTED="${REQUESTED_VERSION:-latest}"
          REQUESTED="${REQUESTED#v}"
          PACKAGE="edamame-cli"
          case "$REQUESTED" in
            latest) ;;
            ""|*[!0-9.]*|.*|*.|*..*)
              echo "::error::version must be latest, X.Y.Z or vX.Y.Z, got '${REQUESTED_VERSION}'"
              exit 1 ;;
            *) PACKAGE="edamame-cli=${REQUESTED}-r1" ;;
          esac
          echo "Installing ${PACKAGE}"
          apk add --no-cache "$PACKAGE" || { echo "apk install failed"; exit 1; }

      - name: Verify binary is available
        id: verify
        run: |
          set -euo pipefail
          command -v edamame_cli
          edamame_cli --version || true
          edamame_cli --help | head -n 20

      - name: Slack alerts
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success') }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C072J0U9TH7'
          slack-message: |
            *CLI Installer Test (Alpine APK)*:
            - Installation: ${{ steps.install.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            - Verification: ${{ steps.verify.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            More details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      - name: Fail job if tests failed
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success') }}
        run: |
          echo "❌ Tests for Alpine (APK) did not succeed"
          exit 1

  
  macos-brew:
    name: macOS (Homebrew)
    runs-on: macos-latest
    if: ${{ inputs.release_context != true }}
    timeout-minutes: 25
    steps:
      - name: Install via Homebrew
        id: install
        run: |
          set -euo pipefail
          brew update
          # Fully-qualified name self-trusts the tap (Homebrew 6.0.0 Tap Trust)
          brew install edamametechnologies/tap/edamame-cli

      - name: Verify binary is available
        id: verify
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          command -v edamame_cli
          edamame_cli --version || true
          # The tap serves one version: a requested version must be it.
          REQUESTED="${REQUESTED_VERSION:-latest}"
          REQUESTED="${REQUESTED#v}"
          if [[ "$REQUESTED" != "latest" ]]; then
            INSTALLED_VERSION=$(edamame_cli --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
            if [[ "$INSTALLED_VERSION" != "$REQUESTED" ]]; then
              echo "::error::Homebrew installed ${INSTALLED_VERSION:-an unknown version}, not the requested ${REQUESTED}"
              exit 1
            fi
          fi
          edamame_cli --help | head -n 20

      - name: Slack alerts
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success') }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C072J0U9TH7'
          slack-message: |
            *CLI Installer Test (macOS Homebrew)*:
            - Installation: ${{ steps.install.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            - Verification: ${{ steps.verify.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            More details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      - name: Fail job if tests failed
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success') }}
        run: |
          echo "❌ Tests for macOS (Homebrew) did not succeed"
          exit 1

  windows-choco:
    name: Windows (Chocolatey)
    runs-on: windows-latest
    if: ${{ inputs.release_context != true }}
    timeout-minutes: 25
    steps:
      - name: Install via Chocolatey
        id: install
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          # The version to test: empty for "latest" (the default, and the
          # schedule), else X.Y.Z from the input (a leading v is dropped).
          $requested = "$env:REQUESTED_VERSION".Trim()
          if ($requested.StartsWith('v')) { $requested = $requested.Substring(1) }
          if ($requested -eq 'latest') { $requested = '' }
          if ($requested -and ($requested -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$')) {
            throw "version must be latest, X.Y.Z or vX.Y.Z, got '$env:REQUESTED_VERSION'"
          }

          function Install-FromGithubRelease {
            $binDir = Join-Path $env:RUNNER_TEMP "edamame_cli_bin"
            New-Item -ItemType Directory -Force -Path $binDir | Out-Null
            $dest = Join-Path $binDir "edamame_cli.exe"
            if ($requested) {
              # The requested release, by its tag: a public download, which
              # also serves a release that is not the latest one.
              $url = "https://github.com/edamametechnologies/edamame_cli/releases/download/v$requested/edamame_cli-$requested-x86_64-pc-windows-msvc.exe"
            } else {
              $release = Invoke-RestMethod -Uri "https://api.github.com/repos/edamametechnologies/edamame_cli/releases/latest" -UseBasicParsing
              $version = $release.tag_name.TrimStart('v')
              $assetName = "edamame_cli-$version-x86_64-pc-windows-msvc.exe"
              $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
              if (-not $asset) {
                throw "Latest GitHub release $($release.tag_name) does not contain $assetName"
              }
              $url = $asset.browser_download_url
            }
            Write-Host "Falling back to the GitHub release asset: $url"
            Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
            Add-Content -Path $env:GITHUB_PATH -Value $binDir
          }

          $chocoArgs = @('install', 'edamame-cli', '-y', '--no-progress')
          if ($requested) { $chocoArgs += @('--version', $requested) }

          $maxRetries = 3
          $retryDelay = 30
          $installed = $false
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Chocolatey install attempt $i/$maxRetries"
            choco @chocoArgs
            if ($LASTEXITCODE -eq 0) {
              $installed = $true
              break
            }
            if ($i -lt $maxRetries) {
              Write-Host "Install failed, retrying in ${retryDelay}s..."
              Start-Sleep -Seconds $retryDelay
            } else {
              Write-Host "All Chocolatey install attempts failed"
            }
          }
          if (-not $installed) {
            Write-Warning "Chocolatey install failed; validating the GitHub release binary instead."
            Install-FromGithubRelease
          }

      - name: Verify binary is available
        id: verify
        shell: pwsh
        run: |
          $exe = Get-Command edamame_cli.exe -ErrorAction Stop
          Write-Host "Binary path: $($exe.Source)"
          $versionOutput = & $exe.Source --version 2>&1
          Write-Host "Version: $versionOutput"
          & $exe.Source --help | Select-Object -First 20
          $fileInfo = Get-Item $exe.Source
          Write-Host "Binary size: $($fileInfo.Length) bytes"
          if ($fileInfo.Length -lt 100000) {
            Write-Host "ERROR: Binary suspiciously small ($($fileInfo.Length) bytes)"
            exit 1
          }

      - name: Slack alerts
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success') }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C072J0U9TH7'
          slack-message: |
            *CLI Installer Test (Windows Chocolatey)*:
            - Installation: ${{ steps.install.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            - Verification: ${{ steps.verify.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            More details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      - name: Fail job if tests failed
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success') }}
        run: |
          echo "Tests for Windows (Chocolatey) did not succeed"
          exit 1

  # Release-gating path: validate the assets THIS release published, straight
  # from the GitHub release. Package managers cannot serve that role during a
  # release -- Chocolatey moderates before listing and Homebrew taps propagate
  # -- so gating on them means gating on the PREVIOUS version. This job has no
  # such lag: the asset is there the moment the release workflow uploads it.
  github-release:
    name: GitHub release assets
    if: ${{ inputs.release_context == true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: edamame_cli-VERSION-x86_64-unknown-linux-gnu
            exec: true
          - runner: macos-latest
            asset: edamame_cli-VERSION-universal-apple-darwin
            exec: true
          - runner: windows-latest
            asset: edamame_cli-VERSION-x86_64-pc-windows-msvc.exe
            exec: true
    steps:
      # Resolve + download over PUBLIC endpoints with curl, never the gh API.
      #
      # The edamametechnologies org has an IP allow list, and GitHub-hosted
      # runners draw addresses outside it, so authenticated `gh release view`
      # intermittently returns "HTTP 403: ... organization has an IP allow
      # list" -- it failed on all three platforms the first time this job ran.
      # Public release reads carry no such restriction, which is why the
      # long-standing linux-apt job resolves versions the same way.
      #
      # A version given as input names the release: its tag is v<version> and
      # nothing is resolved, so the job also tests a release that is not (or
      # not yet) the latest one.
      - name: Resolve the release to test
        id: rel
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          REQUESTED="${REQUESTED_VERSION:-latest}"
          REQUESTED="${REQUESTED#v}"
          if [[ "$REQUESTED" != "latest" ]]; then
            if ! [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must be latest, X.Y.Z or vX.Y.Z, got '${REQUESTED_VERSION}'"
              exit 1
            fi
            echo "tag=v${REQUESTED}" >> "$GITHUB_OUTPUT"
            echo "version=${REQUESTED}" >> "$GITHUB_OUTPUT"
            echo "Validating the requested release v${REQUESTED}"
            exit 0
          fi
          REDIRECT="$(curl -sSI "https://github.com/edamametechnologies/edamame_cli/releases/latest" \
            | grep -i '^location:' | sed 's/location: *//i' | tr -d '\r')"
          TAG="$(printf '%s' "$REDIRECT" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [[ -z "$TAG" ]]; then
            echo "Could not resolve latest release tag from: $REDIRECT"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Validating release $TAG"

      - name: Download and verify asset
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.rel.outputs.version }}"
          ASSET="${{ matrix.asset }}"
          ASSET="${ASSET/VERSION/$VERSION}"
          URL="https://github.com/edamametechnologies/edamame_cli/releases/download/${{ steps.rel.outputs.tag }}/$ASSET"
          echo "Downloading $URL"
          # -f so a 404 is an error rather than a saved error page.
          curl -fsSL -o "$ASSET" "$URL"
          test -s "$ASSET"
          # Presence is not evidence: a truncated or HTML body still saves to
          # disk. Require the binary to actually run.
          chmod +x "$ASSET" || true
          ./"$ASSET" --version || ./"$ASSET" --help | head -n 5
          echo "OK: $ASSET is present and executable"

      - name: Slack alerts
        if: ${{ always() && steps.verify.outcome != 'success' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C072J0U9TH7'
          slack-message: |
            *CLI Release Asset Test (${{ matrix.runner }})*:
            - Asset verification: ❌ Failed
            More details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      - name: Fail job if tests failed
        if: ${{ always() && steps.verify.outcome != 'success' }}
        run: |
          echo "Release asset test for ${{ matrix.runner }} did not succeed"
          exit 1
